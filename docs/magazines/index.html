<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日本評論社の雑誌情報を案内する臨時ページです。">
  <title>雑誌｜日本評論社</title>
  <link rel="stylesheet" href="../css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../" aria-label="日本評論社 臨時ホームページ トップ">
        <img src="../assets/logo.png" alt="日本評論社">
      </a>
      <p class="site-label">臨時ホームページ</p>
    </div>
    <nav class="global-nav" aria-label="主要メニュー">
      <a href="../">ホーム</a><a href="../news/">お知らせ</a>
      <a href="../books/">書籍を探す</a>
      <a href="../#new-books">新刊</a>
      <a class="is-current" href="./">雑誌</a>
      <a href="../company/">会社概要・アクセス</a>
    </nav>
  </header>

  <main>
    <section class="placeholder-main content-width">
      <p class="section-kicker">MAGAZINES</p>
      <h1>雑誌</h1>
      <p class="page-lead">日本評論社が刊行する雑誌の情報を順次掲載します。</p>

      <section class="magazine-card" aria-labelledby="keisemi-title">
        <p class="card-kicker">ECONOMICS</p>
        <h2 id="keisemi-title">経済セミナー</h2>
        <p>経済学を学ぶ人・研究する人のための雑誌『経済セミナー』の関連サイトです。</p>
        <div class="magazine-links">
          <a class="button button-secondary" href="https://note.com/keisemi" target="_blank" rel="noopener noreferrer">『経済セミナー』公式note</a>
          <a class="button button-secondary" href="https://keisemi.github.io/keisemi-article-index/" target="_blank" rel="noopener noreferrer">『経済セミナー』全記事データベース</a>
        </div>
      </section>

      <div class="placeholder-box">
        その他の雑誌情報・新着情報は後続工程で追加します。
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="content-width footer-inner">
      <div>
        <img class="footer-logo" src="../assets/logo.png" alt="日本評論社">
        <p>株式会社日本評論社</p>
      </div>
      <p class="footer-note">臨時ホームページ</p>
    </div>
  </footer>
</body>
</html>

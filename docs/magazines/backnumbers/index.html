<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日本評論社が刊行する定期雑誌のバックナンバーをご案内します。">
  <title>雑誌バックナンバー｜日本評論社</title>
  <link rel="stylesheet" href="../../css/site.css">
  <style>
    .backnumber-main { padding: 64px 0 80px; }
    .backnumber-header { margin-bottom: 34px; }
    .backnumber-header h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 500;
    }
    .backnumber-lead { max-width: 820px; margin: 14px 0 0; color: #555; }
    .backnumber-controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(150px, .45fr);
      gap: 18px;
      margin: 28px 0 26px;
      padding: 22px;
      background: var(--green-pale);
      border-top: 3px solid var(--green);
    }
    .backnumber-control label {
      display: block;
      margin-bottom: 6px;
      color: var(--green-dark);
      font-size: .84rem;
      font-weight: 700;
    }
    .backnumber-control select {
      width: 100%;
      min-height: 46px;
      padding: 8px 12px;
      border: 1px solid #aaa;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .backnumber-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 14px;
    }
    .backnumber-count { margin: 0; color: var(--muted); }
    .backnumber-count strong { color: var(--green-dark); font-size: 1.15rem; }
    .backnumber-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 3px solid var(--green);
      background: #fff;
    }
    .backnumber-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      padding: 24px;
      border-bottom: 1px solid var(--line);
    }
    .backnumber-entry { min-width: 0; }
    .backnumber-item.has-cover .backnumber-entry {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .backnumber-cover-link { display: block; }
    .backnumber-cover {
      display: block;
      width: 78px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border: 1px solid var(--line);
      background: #fff;
    }
    .backnumber-item-title {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
    }
    .backnumber-feature {
      margin: 8px 0 0;
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.55;
    }
    .backnumber-meta { margin: 8px 0 0; color: var(--muted); font-size: .86rem; }
    .backnumber-side { min-width: 140px; text-align: right; }
    .backnumber-detail-link {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid var(--green);
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }
    .backnumber-detail-link:hover { background: var(--green-pale); }
    .backnumber-empty {
      margin: 0;
      padding: 30px 24px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .backnumber-pagination {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }
    .backnumber-page-button {
      min-width: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--green-dark);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .backnumber-page-button[aria-current="page"] {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }
    .backnumber-page-button:disabled { opacity: .35; cursor: default; }
    .back-to-magazines { margin: 0 0 20px; }
    .back-to-magazines a { color: var(--green); font-weight: 700; text-decoration: none; }
    .back-to-magazines a:hover { text-decoration: underline; }
    @media (max-width: 700px) {
      .backnumber-main { padding: 48px 0 64px; }
      .backnumber-controls { grid-template-columns: 1fr; padding: 18px; }
      .backnumber-item { grid-template-columns: 1fr; gap: 14px; padding: 20px 16px; }
      .backnumber-item.has-cover .backnumber-entry { grid-template-columns: 68px minmax(0, 1fr); gap: 14px; }
      .backnumber-cover { width: 68px; }
      .backnumber-side { min-width: 0; text-align: left; }
      .backnumber-toolbar { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../" aria-label="日本評論社 臨時ホームページ トップ">
        <img src="../../assets/logo.png" alt="日本評論社">
      </a>
      <p class="site-label">臨時ホームページ</p>
    </div>
    <nav class="global-nav" aria-label="主要メニュー">
      <a href="../../">ホーム</a>
      <a href="../../news/">お知らせ</a>
      <a href="../../books/">書籍を探す</a>
      <a href="../../#new-books">新刊</a>
      <a class="is-current" href="../">雑誌</a>
      <a href="../../sns/">SNS</a>
      <a href="../../company/">会社概要・お問合せ</a>
    </nav>
  </header>

  <main class="backnumber-main content-width">
    <p class="back-to-magazines"><a href="../">← 雑誌一覧へ戻る</a></p>
    <div class="backnumber-header">
      <p class="section-kicker">BACK NUMBERS</p>
      <h1 id="backnumberTitle">雑誌バックナンバー</h1>
      <p class="backnumber-lead" id="backnumberLead">定期雑誌のバックナンバーを新しい号からご覧いただけます。</p>
    </div>

    <section class="backnumber-controls" aria-label="バックナンバー絞り込み">
      <div class="backnumber-control">
        <label for="magazineSelect">雑誌</label>
        <select id="magazineSelect">
          <option value="1">法律時報</option>
          <option value="2">法学セミナー</option>
          <option value="3">経済セミナー</option>
          <option value="4">数学セミナー</option>
          <option value="6">こころの科学</option>
          <option value="7">そだちの科学</option>
        </select>
      </div>
      <div class="backnumber-control">
        <label for="yearSelect">刊行年</label>
        <select id="yearSelect"><option value="">すべて</option></select>
      </div>
    </section>

    <div id="backnumberLoading">バックナンバーを読み込んでいます…</div>
    <div id="backnumberError" hidden>バックナンバーデータを読み込めませんでした。時間をおいて再度お試しください。</div>

    <div id="backnumberContent" hidden>
      <div class="backnumber-toolbar">
        <p class="backnumber-count" id="backnumberCount"></p>
      </div>
      <ul class="backnumber-list" id="backnumberList"></ul>
      <div class="backnumber-pagination" id="backnumberPagination" aria-label="バックナンバーのページ送り"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="content-width footer-inner">
      <div>
        <img class="footer-logo" src="../../assets/logo.png" alt="日本評論社">
        <p>株式会社日本評論社</p>
        <p>〒170-8474　東京都豊島区南大塚3-12-4<br>
          TEL <a href="tel:0339878611">03-3987-8611</a>（代表）　FAX 03-3987-8593<br>
          e-mail: <a href="mailto:infom@nippyo.co.jp">infom@nippyo.co.jp</a>
        </p>
      </div>
    </div>
  </footer>
  <script src="../../js/magazine-backnumbers.js" defer></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;fill:#222}
.title{font-size:28px;font-weight:700} .label{font-size:20px;font-weight:700} .small{font-size:16px}
.box{fill:#f3f7f2;stroke:#255e17;stroke-width:2;rx:12} .white{fill:#fff;stroke:#789c18;stroke-width:2;rx:12}
.arrow{stroke:#255e17;stroke-width:3;fill:none;marker-end:url(#arrow)}
.note{fill:#fff9e8;stroke:#c29a2b;stroke-width:2;rx:10}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#255e17"/></marker></defs>

<text class="title" x="700" y="46" text-anchor="middle">既存書誌を修正するときの流れ</text>
<rect class="white" x="55" y="115" width="190" height="150" rx="12"/>
<text class="label" x="150" y="160" text-anchor="middle">① 管理ページ</text>
<text class="small" x="150" y="205" text-anchor="middle">対象書を検索</text>
<path class="arrow" d="M250,190 L320,190"/>
<rect class="white" x="330" y="115" width="190" height="150" rx="12"/>
<text class="label" x="425" y="160" text-anchor="middle">② 詳細表示</text>
<text class="small" x="425" y="205" text-anchor="middle">内容を確認</text>
<path class="arrow" d="M525,190 L595,190"/>
<rect class="white" x="605" y="115" width="190" height="150" rx="12"/>
<text class="label" x="700" y="160" text-anchor="middle">③ 編集画面</text>
<text class="small" x="700" y="205" text-anchor="middle">必要箇所だけ修正</text>
<path class="arrow" d="M800,190 L870,190"/>
<rect class="white" x="880" y="115" width="190" height="150" rx="12"/>
<text class="label" x="975" y="160" text-anchor="middle">④ GitHub Issue</text>
<text class="small" x="975" y="205" text-anchor="middle">変更内容を確認して送信</text>
<path class="arrow" d="M1075,190 L1145,190"/>
<rect class="white" x="1155" y="115" width="190" height="150" rx="12"/>
<text class="label" x="1250" y="160" text-anchor="middle">⑤ 自動反映</text>
<text class="small" x="1250" y="205" text-anchor="middle">Issueが閉じたら公開確認</text>
<rect class="note" x="330" y="330" width="740" height="110" rx="12"/>
<text class="label" x="700" y="370" text-anchor="middle">重要：編集画面では現在値が最初から入っています。</text>
<text class="small" x="700" y="407" text-anchor="middle">変更しない欄はそのまま。削除したい値は空欄にすると自動で __CLEAR__ になります。</text>
</svg>
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>書誌管理用検索｜日本評論社 臨時ホームページ</title>
  <link rel="stylesheet" href="../../css/site.css">
  <style>
    .admin-wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
    .admin-note{background:#eef4ec;border-left:5px solid #255e17;padding:14px 16px;margin:18px 0 24px;line-height:1.7}
    .admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 24px}
    .admin-btn{display:inline-block;background:#255e17;color:#fff;text-decoration:none;border:0;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer}
    .admin-btn.secondary{background:#fff;color:#255e17;border:1px solid #255e17}
    .admin-search{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
    .admin-search input{flex:1;min-width:260px;font-size:16px;padding:12px 14px;border:1px solid #b9c5b6;border-radius:6px}
    .result-count{margin:12px 0;color:#4b5a49}
    .book-result{border:1px solid #d4ddd2;border-radius:8px;padding:16px;margin:12px 0;background:#fff}
    .book-result h2{font-size:20px;margin:0 0 8px}
    .book-title-button{appearance:none;background:none;border:0;padding:0;color:#255e17;font:inherit;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
    .book-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:#586455;margin-bottom:12px}
    .book-actions{display:flex;gap:10px;flex-wrap:wrap}
    .empty{padding:24px;border:1px dashed #b9c5b6;border-radius:8px;color:#5e685c}
    .admin-modal[hidden]{display:none}
    .admin-modal{position:fixed;inset:0;z-index:1000}
    .admin-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42)}
    .admin-modal-dialog{position:relative;z-index:1;max-width:920px;max-height:90vh;overflow:auto;margin:5vh auto;background:#fff;border-radius:10px;padding:30px 34px 40px;box-shadow:0 18px 48px rgba(0,0,0,.25)}
    .admin-modal-close{position:absolute;right:16px;top:12px;width:44px;height:44px;border:1px solid #cbd5c8;border-radius:50%;background:#fff;font-size:30px;line-height:1;cursor:pointer}
    .admin-modal-kicker{margin:0 0 14px;color:#255e17;font-weight:700}
    .admin-modal-title{font-size:34px;line-height:1.35;margin:0 48px 10px 0}
    .admin-modal-subtitle{font-size:18px;margin:0 0 18px;color:#4f5b4d}
    .admin-modal-author{font-size:17px;margin:0 0 18px}
    .admin-modal-tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}
    .admin-modal-tags .tag{border:1px solid #cbd5c8;padding:5px 9px;font-size:13px}
    .detail-grid{margin:18px 0 24px;border-top:1px solid #d7dfd5}
    .detail-row{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #d7dfd5}
    .detail-row dt{font-weight:700;color:#536052}
    .detail-row dd{margin:0}
    .admin-detail-section{margin-top:26px}
    .admin-detail-section h3{border-left:4px solid #255e17;padding-left:10px}
    .admin-detail-copy,.admin-detail-toc{line-height:1.85;white-space:normal}
    .admin-edit-box{margin:26px 0 8px;padding:16px;background:#eef4ec;border:1px solid #d4ddd2;border-radius:8px}
    .admin-edit-box p{margin:0 0 12px;line-height:1.7}
    .admin-book-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

    .edit-intro{line-height:1.7;color:#4f5b4d}
    .fixed-fields{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin:18px 0;padding:14px;background:#f6f8f5;border:1px solid #d7dfd5;border-radius:8px}
    .edit-grid{display:grid;grid-template-columns:1fr;gap:14px}
    .edit-grid.two-col{grid-template-columns:1fr 1fr;margin-top:14px}
    .edit-field{display:block}
    .edit-field>span{display:block;font-weight:700;margin-bottom:6px}
    .edit-field input,.edit-field textarea,.edit-field select{width:100%;box-sizing:border-box;font:inherit;padding:10px 11px;border:1px solid #b9c5b6;border-radius:6px;background:#fff}
    .edit-textarea{min-height:92px;resize:vertical}
    .edit-textarea.large{min-height:220px}
    .field-help{margin:6px 0 0;font-size:13px;color:#5b6759;line-height:1.6}
    .field-help code{font-size:12px}
    .edit-submit-box{margin-top:22px;padding:16px;background:#eef4ec;border:1px solid #d4ddd2;border-radius:8px}
    .edit-submit-box p{margin:0 0 12px;line-height:1.7}
    .edit-submit-box .admin-btn{margin-right:8px;margin-bottom:6px}
    body.modal-open{overflow:hidden}
    @media (max-width:720px){
      .admin-modal-dialog{margin:0;max-height:100vh;min-height:100vh;border-radius:0;padding:24px 18px 36px}
      .admin-modal-title{font-size:27px}
      .detail-row{grid-template-columns:1fr;gap:4px}
      .fixed-fields,.edit-grid.two-col{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="admin-wrap">
    <p><a href="../../">← 臨時ホームページへ戻る</a></p>
    <h1>書誌管理用検索</h1>
    <div class="admin-note">
      既存書誌を修正するときは、ここで対象書を検索してください。<br>
      <strong>書名を押すと、公開ページと同じ書誌詳細を確認できます。</strong><br>
      さらに「この書誌を編集」を押すと、現在値がすべて入力済みの編集フォームを開きます。
    </div>

    <div class="admin-actions">
      <a class="admin-btn" id="new-book-link" href="#">新しい書誌を登録</a>
    </div>

    <div class="admin-search">
      <input id="book-query" type="search" placeholder="書名・著者名・ISBN・書籍IDで検索" autocomplete="off">
      <button class="admin-btn" id="search-button" type="button">検索</button>
    </div>
    <p class="result-count" id="result-count"></p>
    <div id="results"></div>
  </main>

  <div class="admin-modal" id="book-modal" hidden>
    <div class="admin-modal-backdrop" data-modal-close></div>
    <section class="admin-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
      <button class="admin-modal-close" id="book-modal-close" type="button" aria-label="閉じる">×</button>
      <div id="book-modal-content"></div>
    </section>
  </div>

  <script src="../../data/books.js"></script>
  <script src="../../data/admin-books.js"></script>
  <script src="admin.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>雑誌管理｜日本評論社 臨時ホームページ</title>
  <link rel="stylesheet" href="../../css/site.css">
  <style>
    .admin-wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
    .admin-links{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px}
    .admin-wrap h1{margin:8px 0 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2rem,4vw,2.7rem);font-weight:500}
    .admin-note{margin:22px 0;padding:16px 18px;background:#eef4ec;border-left:5px solid #255e17;line-height:1.75}
    .magazine-selector{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
    .magazine-choice{padding:12px 10px;border:1px solid #b9c5b6;border-radius:7px;background:#fff;cursor:pointer;text-align:center;font-weight:700}
    .magazine-choice.is-active{background:#255e17;color:#fff;border-color:#255e17}
    .search-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    .search-row input{flex:1;min-width:260px;font-size:16px;padding:12px 14px;border:1px solid #b9c5b6;border-radius:6px}
    .admin-btn{display:inline-block;background:#255e17;color:#fff;text-decoration:none;border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
    .result-count{margin:12px 0;color:#4b5a49}
    .issue-card{display:grid;grid-template-columns:92px 1fr;gap:16px;border:1px solid #d4ddd2;border-radius:8px;padding:16px;margin:12px 0;background:#fff}
    .issue-cover{width:90px;height:128px;object-fit:contain;background:#f6f7f5;border:1px solid #dde3db}
    .issue-cover-empty{width:90px;height:128px;display:flex;align-items:center;justify-content:center;text-align:center;background:#f6f7f5;border:1px solid #dde3db;color:#777;font-size:12px}
    .issue-card h2{font-size:20px;margin:0 0 7px}
    .issue-feature{margin:8px 0;font-weight:700;color:#2d3d29}
    .issue-meta{display:flex;gap:7px 14px;flex-wrap:wrap;font-size:14px;color:#586455;margin:7px 0}
    .issue-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .admin-btn.secondary{background:#fff;color:#255e17;border:1px solid #255e17}
    .empty{padding:24px;border:1px dashed #b9c5b6;border-radius:8px;color:#5e685c}
    .status-note{display:inline-block;padding:3px 8px;border:1px solid #cbd5c8;border-radius:999px;font-size:12px;background:#f7f8f6;color:#666}

    .detail-overlay[hidden]{display:none}
    .detail-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.52);padding:28px 18px;overflow:auto}
    .detail-panel{position:relative;max-width:900px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.25);padding:28px}
    .detail-close{position:absolute;right:16px;top:14px;width:38px;height:38px;border:1px solid #cbd3c9;border-radius:50%;background:#fff;cursor:pointer;font-size:24px;line-height:1}
    .detail-header{display:grid;grid-template-columns:150px 1fr;gap:22px;padding-right:42px}
    .detail-cover{width:148px;max-height:210px;object-fit:contain;border:1px solid #d9dfd7;background:#f6f7f5}
    .detail-cover-empty{width:148px;height:210px;display:flex;align-items:center;justify-content:center;background:#f6f7f5;border:1px solid #d9dfd7;color:#777}
    .detail-kicker{margin:0 0 5px;color:#255e17;font-size:12px;font-weight:700;letter-spacing:.1em}
    .detail-title{margin:0 0 10px;font-size:26px}
    .detail-feature{margin:8px 0;font-size:17px;font-weight:700}
    .detail-table{width:100%;border-collapse:collapse;margin:22px 0}
    .detail-table th,.detail-table td{padding:10px 12px;border-top:1px solid #d9e0d8;vertical-align:top;text-align:left}
    .detail-table th{width:150px;color:#4a5747;font-weight:700;background:#fafbf9}
    .detail-section{margin:26px 0}
    .detail-section h3{margin:0 0 10px;padding-left:10px;border-left:4px solid #255e17;font-size:18px}
    .detail-text{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}
    .detail-link-list{margin:0;padding-left:20px}
    .detail-link-list li{margin:8px 0}
    .detail-link-comment{color:#586455;font-size:14px}
    .detail-loading{padding:50px 0;text-align:center;color:#586455}
    .detail-error{padding:20px;background:#fff3ef;border:1px solid #e2b9ad;border-radius:6px;color:#7d2a1d}
    body.detail-open{overflow:hidden}

    .edit-intro{margin:12px 0 18px;line-height:1.75;color:#4f5b4d}
    .edit-section{margin:24px 0;padding-top:18px;border-top:1px solid #d9e0d8}
    .edit-section h3{margin:0 0 12px;font-size:18px}
    .edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .edit-field{display:block}
    .edit-field.wide{grid-column:1/-1}
    .edit-field>span{display:block;margin-bottom:5px;font-weight:700;color:#394536}
    .edit-field input,.edit-field textarea{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #b9c5b6;border-radius:6px;font:inherit;background:#fff}
    .edit-field textarea{min-height:100px;resize:vertical;line-height:1.6}
    .edit-field textarea.large{min-height:260px}
    .edit-fixed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0;padding:14px;background:#f6f8f5;border:1px solid #dbe2d8;border-radius:7px}
    .edit-submit-box{margin-top:24px;padding:16px 18px;background:#eef4ec;border-left:5px solid #255e17;line-height:1.7}
    .edit-submit-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    @media(max-width:760px){.edit-grid,.edit-fixed{grid-template-columns:1fr}}

    @media(max-width:760px){
      .magazine-selector{grid-template-columns:1fr 1fr}
      .issue-card{grid-template-columns:1fr}
      .issue-cover,.issue-cover-empty{width:110px;height:156px}
      .detail-panel{padding:22px 18px}
      .detail-header{grid-template-columns:1fr;padding-right:34px}
      .detail-cover,.detail-cover-empty{width:120px;height:170px}
      .detail-table th{width:105px}
    }
    @media(max-width:480px){.magazine-selector{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <p class="admin-links">
      <a href="../">← 管理画面ホームに戻る</a>
      <a href="https://github.com/keisemi/nippyo">← リポジトリに戻る</a>
    </p>

    <p class="section-kicker">MAGAZINES</p>
    <h1>雑誌管理</h1>

    <div class="admin-note">
      雑誌を選び、既存号を検索・確認できます。<br>
      各号の<strong>「登録内容を確認」</strong>から現在値を確認し、そのまま<strong>「この号を修正」</strong>へ進めます。<br>
      現在の値が自動入力されるので、必要な箇所だけ変更してください。
    </div>

    <div class="magazine-selector" id="magazine-selector" aria-label="雑誌を選択">
      <button type="button" class="magazine-choice" data-magazine-id="1">法律時報</button>
      <button type="button" class="magazine-choice" data-magazine-id="2">法学セミナー</button>
      <button type="button" class="magazine-choice" data-magazine-id="3">経済セミナー</button>
      <button type="button" class="magazine-choice" data-magazine-id="4">数学セミナー</button>
      <button type="button" class="magazine-choice" data-magazine-id="6">こころの科学</button>
      <button type="button" class="magazine-choice" data-magazine-id="7">そだちの科学</button>
    </div>

    <div class="search-row">
      <input id="issue-query" type="search" placeholder="月号・通巻・特集・書籍ID・ISBN・執筆者などで検索" autocomplete="off">
      <button id="search-button" class="admin-btn" type="button">検索</button>
    </div>

    <p class="result-count" id="result-count">雑誌を選んでください。</p>
    <div id="results"></div>
  </main>

  <div id="detail-overlay" class="detail-overlay" hidden>
    <section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button id="detail-close" class="detail-close" type="button" aria-label="閉じる">×</button>
      <div id="detail-content">
        <p class="detail-loading">登録内容を読み込んでいます。</p>
      </div>
    </section>
  </div>

  <script src="admin.js?v=20261101-f04"></script>
</body>
</html>

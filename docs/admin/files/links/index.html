<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>関連リンク管理｜日本評論社 臨時ホームページ</title>
  <link rel="stylesheet" href="../../../css/site.css">
  <style>
    .admin-wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
    .admin-links{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px}
    .admin-wrap h1{margin:8px 0 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2rem,4vw,2.7rem);font-weight:500}
    .admin-note{margin:22px 0;padding:16px 18px;background:#eef4ec;border-left:5px solid #255e17;line-height:1.75}
    .admin-search{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
    .admin-search input{flex:1;min-width:260px;font-size:16px;padding:12px 14px;border:1px solid #b9c5b6;border-radius:6px}
    .admin-btn{display:inline-block;background:#255e17;color:#fff;text-decoration:none;border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
    .admin-btn.secondary{background:#fff;color:#255e17;border:1px solid #255e17}
    .admin-btn.danger{background:#fff;color:#8a1f11;border:1px solid #b94b3d}
    .result-count{margin:12px 0;color:#4b5a49}
    .book-result{border:1px solid #d4ddd2;border-radius:8px;padding:18px;margin:12px 0;background:#fff}
    .book-result h2{font-size:19px;margin:0 0 8px}
    .book-meta{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:14px;color:#586455;margin-bottom:14px}
    .book-actions{margin:14px 0 0}
    .link-list{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
    .link-item{padding:13px 14px;border:1px solid #dbe2d8;border-radius:7px;background:#fafbf9}
    .link-title{font-weight:700;margin:0 0 5px}
    .link-comment{margin:5px 0;color:#586455;white-space:pre-wrap}
    .link-url{margin:5px 0;font-size:13px;overflow-wrap:anywhere}
    .link-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .status{display:inline-block;padding:2px 8px;border:1px solid #cbd5c8;border-radius:999px;font-size:12px;background:#eef4ec;color:#255e17}
    .empty{padding:24px;border:1px dashed #b9c5b6;border-radius:8px;color:#5e685c}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <p class="admin-links">
      <a href="../">← 書籍関連ファイル管理に戻る</a>
      <a href="../../">← 管理画面ホームに戻る</a>
      <a href="https://github.com/keisemi/nippyo">← リポジトリに戻る</a>
    </p>

    <p class="section-kicker">EXTERNAL LINK</p>
    <h1>関連リンク管理</h1>

    <div class="admin-note">
      書名・著者・ISBN・書籍IDで対象書籍を検索してください。<br>
      サポートサイト、動画、記事、イベントページなどの<strong>外部リンク</strong>を追加・修正・削除できます。
      複数のリンクがある場合も、この画面で1件ずつ管理できます。
    </div>

    <div class="admin-search">
      <input id="book-query" type="search" placeholder="書名・著者・ISBN・書籍IDで検索" autocomplete="off">
      <button class="admin-btn" id="search-button" type="button">検索</button>
    </div>

    <p class="result-count" id="result-count">検索語を入力してください。</p>
    <div id="results"></div>
  </main>

  <script src="admin.js"></script>
</body>
</html>

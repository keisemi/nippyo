<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>付属データ管理｜日本評論社 臨時ホームページ</title>
  <link rel="stylesheet" href="../../../css/site.css">
  <style>
    .admin-wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
    .admin-links{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px}
    .admin-wrap h1{margin:8px 0 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2rem,4vw,2.7rem);font-weight:500}
    .admin-note{margin:22px 0;padding:16px 18px;background:#eef4ec;border-left:5px solid #255e17;line-height:1.75}
    .admin-search{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
    .admin-search input{flex:1;min-width:260px;font-size:16px;padding:12px 14px;border:1px solid #b9c5b6;border-radius:6px}
    .admin-search select{font-size:16px;padding:12px 36px 12px 12px;border:1px solid #b9c5b6;border-radius:6px;background:#fff}
    .admin-btn{display:inline-block;background:#255e17;color:#fff;text-decoration:none;border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
    .admin-btn.danger{background:#fff;color:#8a1f11;border:1px solid #b94b3d}
    .result-count{margin:12px 0;color:#4b5a49}
    .book-result{border:1px solid #d4ddd2;border-radius:8px;padding:16px;margin:12px 0;background:#fff}
    .book-result h2{font-size:19px;margin:0 0 8px}
    .book-meta{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:14px;color:#586455;margin-bottom:12px}
    .book-actions{display:flex;gap:10px;flex-wrap:wrap}
    .status{display:inline-block;padding:2px 8px;border:1px solid #cbd5c8;border-radius:999px;font-size:12px}
    .status.on{background:#eef4ec;color:#255e17}
    .status.pending{background:#fff4dc;color:#805a00;border-color:#e1c373}
    .status.off{background:#f3f3f3;color:#666}
    .empty{padding:24px;border:1px dashed #b9c5b6;border-radius:8px;color:#5e685c}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <p class="admin-links">
      <a href="../">← 書籍関連ファイル管理に戻る</a>
      <a href="../../">← 管理画面ホームに戻る</a>
      <a href="https://github.com/keisemi/nippyo">← リポジトリに戻る</a>
    </p>

    <p class="section-kicker">RELATED</p>
    <h1>付属データ管理</h1>

    <div class="admin-note">
      書名・著者・ISBN・書籍IDで検索できます。<br>
      <strong>「登録済み」は実際に付属データがある状態、「要アップロード」は書誌上は関連情報ありでもファイルがまだない状態です。</strong><br>
      ファイルの選択は、対象書籍を選んだ後の確認画面で行います。元のファイル名は何でも構いません。<strong>1点につき最大25MB</strong>です。複数ファイルや旧形式のOfficeファイルはZIPにまとめてください。
    </div>

    <div class="admin-search">
      <input id="book-query" type="search" placeholder="書名・著者・ISBN・書籍IDで検索" autocomplete="off">
      <select id="related-filter" aria-label="付属データファイルの登録状態">
        <option value="all">付属データ：すべて</option>
        <option value="yes">付属データ：ファイルあり</option>
        <option value="no">付属データ：ファイルなし</option>
        <option value="pending">付属データ：要アップロード</option>
      </select>
      <button class="admin-btn" id="search-button" type="button">検索</button>
    </div>

    <p class="result-count" id="result-count">検索語を入力するか、付属データファイルの状態を選んでください。</p>
    <div id="results"></div>
  </main>

  <script src="admin.js"></script>
</body>
</html>

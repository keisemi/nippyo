name: "【入力用】書影を管理"
description: "管理画面で対象書籍を選んでから、書影の追加・差替え・削除を行います。"
title: "[書影管理] "
body:
  - type: markdown
    attributes:
      value: |
        管理画面から対象書籍を選択した後の確認画面です。
        **追加・差替えの場合は、JPG・JPEG・PNG・WebP画像を1点だけ選択してください（最大10MB）。**
        削除の場合は画像ファイルの選択は不要です。

  - type: input
    id: book_id
    attributes:
      label: 書籍ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: current_title
    attributes:
      label: 現在の書名
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options:
        - 追加・差替え
        - 削除
    validations:
      required: true

  - type: upload
    id: image_file
    attributes:
      label: 画像ファイル
      description: 追加・差替えの場合のみ、JPG・JPEG・PNG・WebP画像を1点選択してください（最大10MB）。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 対象書籍と操作内容を確認しました。
          required: true

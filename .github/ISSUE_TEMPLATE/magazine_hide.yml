name: "【入力用】雑誌号を非公開にする"
description: "雑誌管理画面で対象号を選んでから使用してください。"
title: "[雑誌号公開停止] "
body:
  - type: markdown
    attributes:
      value: |
        雑誌号を一般公開サイトから非公開にするための確認フォームです。
        **非公開にしても雑誌号の書誌データ自体は削除されません。**
        管理画面からは引き続き検索・確認・修正できます。

  - type: input
    id: book_id
    attributes:
      label: 書籍ID
      description: "雑誌管理画面から自動入力されます。変更しないでください。"
    validations:
      required: true

  - type: input
    id: magazine_id
    attributes:
      label: 雑誌ID
      description: "雑誌管理画面から自動入力されます。変更しないでください。"
    validations:
      required: true

  - type: input
    id: magazine_name
    attributes:
      label: 雑誌名
      description: "対象誌の確認用です。"
    validations:
      required: true

  - type: input
    id: current_issue
    attributes:
      label: 現在の雑誌月号
      description: "対象号の確認用です。"
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: "この号を書誌データを残したまま、一般公開サイトでは非公開にすることを確認しました。"
          required: true

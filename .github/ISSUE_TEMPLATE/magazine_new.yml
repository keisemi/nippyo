name: "【入力用】新しい雑誌号を登録"
description: "選んだ雑誌の最新号を雛形にして、新しい号を登録します。"
title: "[雑誌号新規] "
body:
  - type: markdown
    attributes:
      value: |
        新しい雑誌号の登録フォームです。
        **登録先の雑誌は「雑誌コード(1)」から自動判定します。雑誌名を選ぶ必要はありません。**
        判定した雑誌の現在の最新号を自動で雛形にし、判型・本誌編者などの固定項目を引き継ぎます。
        月号・通巻・発刊日・価格・特集・目次など、毎号変わる項目を入力してください。
        未対応の雑誌コード(1)は登録せず、エラーで停止します。
        **公開状態は初期値「非公開」です。先の号を事前登録しても、公開を選ばない限りサイトには表示されません。**

  - type: dropdown
    id: publication_state
    attributes:
      label: 公開状態
      description: "通常は「非公開」のまま登録してください。公開準備が整っている号だけ「公開」を選びます。"
      options:
        - 非公開（登録だけする）
        - 公開（登録後すぐサイトに出す）
      default: 0
    validations:
      required: true

  - type: textarea
    id: registration_data
    attributes:
      label: 登録データ
      description: "管理画面から通常は自動入力されます。内容は変更しないでください。空欄の場合だけ、管理画面の案内に従って Ctrl+V で貼り付けてください。"
      placeholder: "通常は自動入力されます"
    validations:
      required: true

  - type: input
    id: magazine_code_1
    attributes:
      label: 雑誌コード(1)
      description: "このコードから登録先の雑誌を自動判定します。例：経済セミナー 03545"
    validations:
      required: true

  - type: input
    id: magazine_code_2
    attributes:
      label: 雑誌コード(2)

  - type: input
    id: new_book_id
    attributes:
      label: 新しい書籍ID
      description: "雑誌6誌で重複しないIDを入力してください。"
    validations:
      required: true

  - type: input
    id: mag_issue
    attributes:
      label: 雑誌月号
      description: "例：2026年12月・2027年1月号"
    validations:
      required: true

  - type: input
    id: issue_number
    attributes:
      label: 雑誌通算番号
    validations:
      required: true

  - type: input
    id: pub_date
    attributes:
      label: 発刊日
      description: "YYYY-MM-DD 形式。例：2026-11-27"
    validations:
      required: true

  - type: input
    id: format
    attributes:
      label: 判型
      description: "空欄なら最新号の値を引き継ぎます。"

  - type: input
    id: pages
    attributes:
      label: ページ数
      description: "数字のみ。"

  - type: input
    id: price_body
    attributes:
      label: 本体価格
      description: "数字のみ。"

  - type: input
    id: isbn_old
    attributes:
      label: 旧ISBN

  - type: input
    id: isbn_new
    attributes:
      label: 新ISBN

  - type: input
    id: subtitle_before
    attributes:
      label: 前副題

  - type: input
    id: feature
    attributes:
      label: 特集

  - type: input
    id: feature_yomi
    attributes:
      label: 特集よみ

  - type: input
    id: feature_subtitle
    attributes:
      label: 後副題

  - type: input
    id: description_heading
    attributes:
      label: 特集内容紹介文見出

  - type: textarea
    id: description
    attributes:
      label: 特集内容紹介文

  - type: input
    id: subtitle_before2
    attributes:
      label: 前副題2

  - type: input
    id: feature2
    attributes:
      label: 特集2

  - type: input
    id: feature_yomi2
    attributes:
      label: 特集2よみ

  - type: input
    id: feature_subtitle2
    attributes:
      label: 後副題2

  - type: input
    id: description_heading2
    attributes:
      label: 特集2 内容紹介文見出

  - type: textarea
    id: description2
    attributes:
      label: 特集2 内容紹介文

  - type: textarea
    id: toc
    attributes:
      label: 目次
      description: "書誌詳細ページに表示する整形済みの目次を貼り付けてください。"

  - type: input
    id: external_link_title_1
    attributes:
      label: 外部リンク1 タイトル

  - type: textarea
    id: external_link_comment_1
    attributes:
      label: 外部リンク1 コメント

  - type: input
    id: external_link_url_1
    attributes:
      label: 外部リンク1 URL

  - type: input
    id: external_link_title_2
    attributes:
      label: 外部リンク2 タイトル

  - type: textarea
    id: external_link_comment_2
    attributes:
      label: 外部リンク2 コメント

  - type: input
    id: external_link_url_2
    attributes:
      label: 外部リンク2 URL

  - type: input
    id: external_link_title_3
    attributes:
      label: 外部リンク3 タイトル

  - type: textarea
    id: external_link_comment_3
    attributes:
      label: 外部リンク3 コメント

  - type: input
    id: external_link_url_3
    attributes:
      label: 外部リンク3 URL

  - type: textarea
    id: editor
    attributes:
      label: 本誌編者
      description: "空欄なら最新号の値を引き継ぎます。"

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 登録する雑誌・月号・通巻番号・発刊日・書籍IDを確認しました。
          required: true

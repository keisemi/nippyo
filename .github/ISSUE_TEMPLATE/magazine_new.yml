name: "【入力用】新しい雑誌号を登録"
description: "雑誌管理画面で最新号を雛形にし、新しい号を登録します。"
title: "[雑誌号新規] "
body:
  - type: markdown
    attributes:
      value: |
        新しい雑誌号の登録内容を確認するフォームです。
        管理画面で入力した全項目は、URLが長くなりすぎないよう圧縮した「登録データ」として渡しています。
        下の基本情報を確認し、**「登録データ」は変更せず**そのまま送信してください。
        **現段階では登録後すぐ公開サイトへ反映されます。**

  - type: input
    id: source_book_id
    attributes:
      label: 雛形号の書籍ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: source_issue
    attributes:
      label: 雛形号の雑誌月号
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: magazine_id
    attributes:
      label: 雑誌ID
    validations:
      required: true

  - type: input
    id: magazine_name
    attributes:
      label: 雑誌名
    validations:
      required: true

  - type: input
    id: new_book_id
    attributes:
      label: 新しい書籍ID
    validations:
      required: true

  - type: input
    id: mag_issue
    attributes:
      label: 雑誌月号
    validations:
      required: true

  - type: input
    id: issue_number
    attributes:
      label: 雑誌通算番号
    validations:
      required: true

  - type: input
    id: pub_date
    attributes:
      label: 発刊日
    validations:
      required: true

  - type: input
    id: format
    attributes:
      label: 判型

  - type: input
    id: pages
    attributes:
      label: ページ数

  - type: input
    id: price_body
    attributes:
      label: 本体価格

  - type: input
    id: isbn_old
    attributes:
      label: 旧ISBN

  - type: input
    id: isbn_new
    attributes:
      label: 新ISBN

  - type: input
    id: magazine_code_1
    attributes:
      label: 雑誌コード(1)

  - type: input
    id: magazine_code_2
    attributes:
      label: 雑誌コード(2)

  - type: input
    id: feature
    attributes:
      label: 特集

  - type: textarea
    id: payload
    attributes:
      label: 登録データ
      description: 管理画面が自動生成した圧縮データです。変更・削除しないでください。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 管理画面で新しい号の内容を確認しました。「登録データ」は変更していません。
          required: true

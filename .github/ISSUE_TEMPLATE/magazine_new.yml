name: "【入力用】新しい雑誌号を登録"
description: "雑誌管理画面で最新号を雛形にし、新しい号を登録します。"
title: "[雑誌号新規] "
body:
  - type: markdown
    attributes:
      value: |
        新しい雑誌号の登録内容を確認するフォームです。
        基本情報は管理画面から自動入力されています。
        **「登録データ」欄をクリックして Ctrl+V で貼り付けてください。**
        管理画面で入力した特集・目次などの全項目が、すでにクリップボードへコピーされています。
        **現段階では登録後すぐ公開サイトへ反映されます。**

  - type: input
    id: source_book_id
    attributes:
      label: 雛形号の書籍ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: source_issue
    attributes:
      label: 雛形号の雑誌月号
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: magazine_id
    attributes:
      label: 雑誌ID
    validations:
      required: true

  - type: input
    id: magazine_name
    attributes:
      label: 雑誌名
    validations:
      required: true

  - type: input
    id: new_book_id
    attributes:
      label: 新しい書籍ID
    validations:
      required: true

  - type: input
    id: mag_issue
    attributes:
      label: 雑誌月号
    validations:
      required: true

  - type: input
    id: issue_number
    attributes:
      label: 雑誌通算番号
    validations:
      required: true

  - type: input
    id: pub_date
    attributes:
      label: 発刊日
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: 登録データ
      description: この欄をクリックして Ctrl+V で貼り付けてください。管理画面で入力した全項目が入ります。貼り付け後は内容を変更しないでください。
      placeholder: "ここをクリックして Ctrl+V で貼り付け"
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 管理画面で新しい号の内容を確認し、「登録データ」を貼り付けました。
          required: true

name: "【入力用】雑誌号の書影を管理"
description: "雑誌管理画面で対象号を選び、書影の追加・差替え・削除を行います。"
title: "[雑誌書影管理] "
body:
  - type: markdown
    attributes:
      value: |
        雑誌号の書影を更新するための確認フォームです。
        **追加・差替えの場合は、JPG・JPEG・PNG・WebP画像を1点だけ選択してください（最大10MB）。**
        削除の場合は画像ファイルの選択は不要です。
        書誌情報そのものは変更しません。

  - type: input
    id: book_id
    attributes:
      label: 書籍ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: magazine_id
    attributes:
      label: 雑誌ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: magazine_name
    attributes:
      label: 雑誌名
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: current_issue
    attributes:
      label: 現在の雑誌月号
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options:
        - 追加・差替え
        - 削除
    validations:
      required: true

  - type: upload
    id: image_file
    attributes:
      label: 画像ファイル
      description: 追加・差替えの場合のみ、JPG・JPEG・PNG・WebP画像を1点選択してください（最大10MB）。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 対象の雑誌名・月号・書籍IDと操作内容を確認しました。
          required: true

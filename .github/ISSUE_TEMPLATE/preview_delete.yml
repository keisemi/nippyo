name: "【入力用】立ち読みPDFを削除"
description: "対象の書籍または雑誌号の立ち読みPDFを削除します。"
title: "[立ち読み管理] 削除: "
body:
  - type: markdown
    attributes:
      value: |
        対象の**立ち読みPDFを削除**します。
        書誌情報そのものは削除しません。

  - type: input
    id: target_type
    attributes:
      label: 対象種別
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: book_id
    attributes:
      label: 書籍ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: current_title
    attributes:
      label: 現在の書名
      description: 書籍の場合のみ管理画面から自動入力されます。雑誌の場合は空欄のままにしてください。
    validations:
      required: false

  - type: input
    id: magazine_id
    attributes:
      label: 雑誌ID
      description: 雑誌の場合のみ管理画面から自動入力されます。書籍の場合は空欄のままにしてください。
    validations:
      required: false

  - type: input
    id: magazine_name
    attributes:
      label: 雑誌名
      description: 雑誌の場合のみ管理画面から自動入力されます。書籍の場合は空欄のままにしてください。
    validations:
      required: false

  - type: input
    id: current_issue
    attributes:
      label: 現在の雑誌月号
      description: 雑誌の場合のみ管理画面から自動入力されます。書籍の場合は空欄のままにしてください。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: この立ち読みPDFを削除します。
          required: true

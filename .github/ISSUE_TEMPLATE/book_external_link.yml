name: "【入力用】関連リンクを管理"
description: "管理画面で対象書籍を選んでから、外部関連リンクの追加・修正・削除を行います。"
title: "[関連リンク管理] "
body:
  - type: markdown
    attributes:
      value: |
        管理画面から対象書籍とリンクを選択した後の確認画面です。
        追加・修正の場合は、リンク名・説明・URLを確認してください。
        削除の場合は、現在のリンク情報を確認してそのまま送信してください。

  - type: input
    id: book_id
    attributes:
      label: 書籍ID
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: input
    id: current_title
    attributes:
      label: 現在の書名
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options:
        - 追加
        - 修正
        - 削除
    validations:
      required: true

  - type: input
    id: current_slot
    attributes:
      label: 現在のリンク番号
      description: 修正・削除の場合に管理画面から自動入力されます。変更しないでください。

  - type: input
    id: current_url
    attributes:
      label: 現在のURL
      description: 修正・削除の対象確認用です。管理画面から自動入力されます。変更しないでください。

  - type: input
    id: link_title
    attributes:
      label: リンク名
      description: 例：著者サポートサイト／刊行記念動画

  - type: textarea
    id: comment
    attributes:
      label: 説明
      description: 補足説明がなければ空欄で構いません。

  - type: input
    id: url
    attributes:
      label: URL
      description: https:// または http:// から始まるURLを入力してください。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 対象書籍と関連リンクの内容を確認しました。
          required: true

name: "【入力用】お知らせを公開停止"
description: "対象のお知らせを削除せず、公開サイトから非表示にします。"
title: "[お知らせ管理] 公開停止: "
body:
  - type: markdown
    attributes:
      value: |
        対象のお知らせを**公開停止**します。
        データは削除されず、管理画面には残るため、あとで再公開できます。

  - type: input
    id: target_title
    attributes:
      label: 対象のお知らせ
      description: 管理画面から自動入力されます。変更しないでください。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: このお知らせを公開停止します。
          required: true

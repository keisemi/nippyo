name: "【自動】書誌申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: book-data-maintenance
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ (startsWith(github.event.issue.title, '[書誌修正]') || startsWith(github.event.issue.title, '[書誌新規]')) && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームは書誌更新権限のある担当者専用です。この申請から書誌データは変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ (startsWith(github.event.issue.title, '[書誌修正]') || startsWith(github.event.issue.title, '[書誌新規]')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update book master from issue form
        run: python scripts/manage_book_issue.py

      - name: Generate search data
        run: python scripts/build_data.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          master = Path('data/book_search_master.csv')
          with master.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          books = json.loads(Path('docs/data/books.json').read_text(encoding='utf-8'))

          if not rows or not books:
              raise SystemExit('書誌データが空です。')
          if len(rows) != len(books):
              raise SystemExit('マスターCSVと検索データの件数が一致しません。')
          ids = [str(x.get('id', '')).strip() for x in books]
          if any(not x for x in ids):
              raise SystemExit('空の書籍IDがあります。')
          if len(ids) != len(set(ids)):
              raise SystemExit('書籍IDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in books):
              raise SystemExit('空の書名があります。')
          print(f'検証OK: {len(books):,}件')
          PY
          node --check docs/books/js/app.js
          node --check docs/js/home.js
          node --check docs/admin/books/admin.js
          git diff --check

      - name: Commit updated data
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/book_search_master.csv docs/data/books.json docs/data/books.js docs/data/home-books.js docs/data/admin-books.js docs/data/last-updated.txt
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Book data: issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "書誌情報の更新を反映し、臨時サイトを再公開しました。${PAGE_URL}"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

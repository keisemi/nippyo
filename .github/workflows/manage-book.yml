name: "【自動】書誌申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: book-data-maintenance
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ (startsWith(github.event.issue.title, '[書誌修正]') || startsWith(github.event.issue.title, '[書誌新規]')) && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームは書誌更新権限のある担当者専用です。この申請から書誌データは変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ (startsWith(github.event.issue.title, '[書誌修正]') || startsWith(github.event.issue.title, '[書誌新規]')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update book master from issue form
        run: python scripts/manage_book_issue.py

      - name: Generate search data
        run: python scripts/build_data.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          master = Path('data/book_search_master.csv')
          with master.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          search_payload = json.loads(Path('docs/data/books-search.json').read_text(encoding='utf-8'))
          search_rows = search_payload.get('books') if isinstance(search_payload, dict) else None
          book_search_index = json.loads(Path('docs/data/books-search-index.json').read_text(encoding='utf-8'))
          book_index_rows = book_search_index.get('search') if isinstance(book_search_index, dict) else None
          admin_search_index = json.loads(Path('docs/data/books-admin-search-index.json').read_text(encoding='utf-8'))
          admin_index_rows = admin_search_index.get('search') if isinstance(admin_search_index, dict) else None
          if isinstance(search_rows, list) and search_rows and isinstance(search_rows[0], list):
              columns = search_payload.get('columns')
              if not isinstance(columns, list) or not columns:
                  raise SystemExit('books の列定義がありません。')
              if any(not isinstance(row, list) or len(row) != len(columns) for row in search_rows):
                  raise SystemExit('books の行長が列定義と一致しません。')
              books = [dict(zip(columns, row)) for row in search_rows]
          else:
              books = search_rows

          if not rows or not isinstance(books, list) or not books:
              raise SystemExit('書誌データが空です。')
          if len(rows) != len(books):
              raise SystemExit('マスターCSVと検索用データの件数が一致しません。')
          ids = [str(x.get('id', '')).strip() for x in books]
          if any(not x for x in ids):
              raise SystemExit('空の書籍IDがあります。')
          if len(ids) != len(set(ids)):
              raise SystemExit('書籍IDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in books):
              raise SystemExit('空の書名があります。')
          if not isinstance(book_index_rows, list) or len(book_index_rows) != len(books):
              raise SystemExit('書籍検索索引と表示データの件数が一致しません。')
          if any(not isinstance(x, str) for x in book_index_rows):
              raise SystemExit('書籍検索索引に文字列以外の値があります。')
          if not isinstance(admin_index_rows, list) or len(admin_index_rows) != len(books):
              raise SystemExit('管理画面用書籍検索索引と表示データの件数が一致しません。')
          if any(not isinstance(x, str) for x in admin_index_rows):
              raise SystemExit('管理画面用書籍検索索引に文字列以外の値があります。')
          book_order = search_payload.get('default_order') if isinstance(search_payload, dict) else None
          if not isinstance(book_order, list) or sorted(book_order) != list(range(len(books))):
              raise SystemExit('書籍の既定表示順が不正です。')
          if 'search_extra' in (search_payload.get('columns') or []):
              raise SystemExit('初期表示用書籍データに検索専用補助文字列が残っています。')

          detail_ids = []
          detail_files = sorted(Path('docs/data/book-details').glob('books-detail-*.json'))
          if not detail_files:
              raise SystemExit('刊行年別の書籍詳細データが生成されていません。')
          for path in detail_files:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path} の形式が不正です。')
              detail_ids.extend(str(x).strip() for x in payload.keys())
          if set(detail_ids) != set(ids):
              raise SystemExit('検索用データと刊行年別詳細データの書籍IDが一致しません。')

          search_size = Path('docs/data/books-search.json').stat().st_size
          book_index_size = Path('docs/data/books-search-index.json').stat().st_size
          admin_index_size = Path('docs/data/books-admin-search-index.json').stat().st_size
          if search_size > 3 * 1024 * 1024:
              raise SystemExit(f'初期表示用書誌データが3MBを超えています: {search_size:,} bytes')
          if book_index_size > 4 * 1024 * 1024:
              raise SystemExit(f'書籍検索索引が4MBを超えています: {book_index_size:,} bytes')
          if admin_index_size > 4 * 1024 * 1024:
              raise SystemExit(f'管理画面用書籍検索索引が4MBを超えています: {admin_index_size:,} bytes')
          if Path('docs/data/books.js').exists() or Path('docs/data/books.json').exists() or Path('docs/data/admin-books.js').exists():
              raise SystemExit('旧形式の巨大書誌データが残っています。')
          print(f'検証OK: {len(books):,}件／詳細{len(detail_files):,}ファイル／初期表示{search_size / 1024 / 1024:.2f}MB／公開索引{book_index_size / 1024 / 1024:.2f}MB／管理索引{admin_index_size / 1024 / 1024:.2f}MB')
          PY
          node --check docs/books/js/app.js
          node --check docs/js/home.js
          node --check docs/admin/books/admin.js
          git diff --check

      - name: Commit updated data
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/book_search_master.csv
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Book data: issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "書誌情報の更新を反映し、臨時サイトを再公開しました。${PAGE_URL}"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

name: "【自動】書誌申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: nippyo-site-maintenance
  queue: max
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ (startsWith(github.event.issue.title, '[書誌修正]') || startsWith(github.event.issue.title, '[書誌新規]') || startsWith(github.event.issue.title, '[書誌公開停止]') || startsWith(github.event.issue.title, '[書誌再公開]') || startsWith(github.event.issue.title, '[書誌削除]')) && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームは書誌更新権限のある担当者専用です。この申請から書誌データは変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ (startsWith(github.event.issue.title, '[書誌修正]') || startsWith(github.event.issue.title, '[書誌新規]') || startsWith(github.event.issue.title, '[書誌公開停止]') || startsWith(github.event.issue.title, '[書誌再公開]') || startsWith(github.event.issue.title, '[書誌削除]')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update book master from issue form
        run: python scripts/manage_book_issue.py

      - name: Generate search data
        run: python scripts/build_data.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          master = Path('data/book_search_master.csv')
          with master.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          hidden_path = Path('data/book_hidden_ids.txt')
          hidden_ids = set()
          if hidden_path.exists():
              for raw_line in hidden_path.read_text(encoding='utf-8').splitlines():
                  value = raw_line.strip()
                  if value and not value.startswith('#'):
                      hidden_ids.add(value)

          def expand_rows(payload, key):
              if not isinstance(payload, dict):
                  return None
              data = payload.get(key)
              if not isinstance(data, list):
                  return None
              if not data or not isinstance(data[0], list):
                  return data
              columns = payload.get('columns')
              if not isinstance(columns, list) or not columns:
                  raise SystemExit(f'{key} の列定義がありません。')
              if any(not isinstance(row, list) or len(row) != len(columns) for row in data):
                  raise SystemExit(f'{key} の行長が列定義と一致しません。')
              return [dict(zip(columns, row)) for row in data]

          search_payload = json.loads(Path('docs/data/books-search.json').read_text(encoding='utf-8'))
          books = expand_rows(search_payload, 'books')
          admin_payload = json.loads(Path('docs/data/books-admin-search.json').read_text(encoding='utf-8'))
          admin_books = expand_rows(admin_payload, 'books')
          book_search_index = json.loads(Path('docs/data/books-search-index.json').read_text(encoding='utf-8'))
          book_index_rows = book_search_index.get('search') if isinstance(book_search_index, dict) else None
          admin_search_index = json.loads(Path('docs/data/books-admin-search-index.json').read_text(encoding='utf-8'))
          admin_index_rows = admin_search_index.get('search') if isinstance(admin_search_index, dict) else None

          if not rows or not isinstance(books, list) or not isinstance(admin_books, list) or not admin_books:
              raise SystemExit('書誌データが空です。')

          master_ids = [str(x.get('id', '')).strip() for x in rows]
          if any(not x for x in master_ids):
              raise SystemExit('空の書籍IDがあります。')
          if len(master_ids) != len(set(master_ids)):
              raise SystemExit('書籍IDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in rows):
              raise SystemExit('空の書名があります。')

          unknown_hidden = hidden_ids - set(master_ids)
          if unknown_hidden:
              raise SystemExit('公開停止IDに対応する書籍がありません: ' + ', '.join(sorted(unknown_hidden)))

          public_ids = [str(x.get('id', '')).strip() for x in books]
          admin_ids = [str(x.get('id', '')).strip() for x in admin_books]
          expected_public_ids = set(master_ids) - hidden_ids
          if set(public_ids) != expected_public_ids:
              raise SystemExit('公開用検索データと公開状態が一致しません。')
          if set(admin_ids) != set(master_ids):
              raise SystemExit('管理画面用検索データとマスターCSVの書籍IDが一致しません。')
          if len(admin_books) != len(rows):
              raise SystemExit('管理画面用検索データとマスターCSVの件数が一致しません。')

          if not isinstance(book_index_rows, list) or len(book_index_rows) != len(books):
              raise SystemExit('公開用書籍検索索引と表示データの件数が一致しません。')
          if any(not isinstance(x, str) for x in book_index_rows):
              raise SystemExit('公開用書籍検索索引に文字列以外の値があります。')
          if not isinstance(admin_index_rows, list) or len(admin_index_rows) != len(admin_books):
              raise SystemExit('管理画面用書籍検索索引と表示データの件数が一致しません。')
          if any(not isinstance(x, str) for x in admin_index_rows):
              raise SystemExit('管理画面用書籍検索索引に文字列以外の値があります。')

          book_order = search_payload.get('default_order') if isinstance(search_payload, dict) else None
          if not isinstance(book_order, list) or sorted(book_order) != list(range(len(books))):
              raise SystemExit('書籍の既定表示順が不正です。')
          admin_order = admin_payload.get('default_order') if isinstance(admin_payload, dict) else None
          if not isinstance(admin_order, list) or sorted(admin_order) != list(range(len(admin_books))):
              raise SystemExit('管理画面用書籍の既定表示順が不正です。')
          if 'search_extra' in (search_payload.get('columns') or []):
              raise SystemExit('公開用書籍データに検索専用補助文字列が残っています。')
          if 'search_extra' in (admin_payload.get('columns') or []):
              raise SystemExit('管理画面用書籍データに検索専用補助文字列が残っています。')

          detail_ids = []
          detail_files = sorted(Path('docs/data/book-details').glob('books-detail-*.json'))
          if not detail_files:
              raise SystemExit('刊行年別の書籍詳細データが生成されていません。')
          for path in detail_files:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path} の形式が不正です。')
              detail_ids.extend(str(x).strip() for x in payload.keys())
          if set(detail_ids) != set(master_ids):
              raise SystemExit('管理画面用検索データと刊行年別詳細データの書籍IDが一致しません。')

          search_size = Path('docs/data/books-search.json').stat().st_size
          admin_search_size = Path('docs/data/books-admin-search.json').stat().st_size
          book_index_size = Path('docs/data/books-search-index.json').stat().st_size
          admin_index_size = Path('docs/data/books-admin-search-index.json').stat().st_size
          if search_size > 3 * 1024 * 1024:
              raise SystemExit(f'公開用書誌データが3MBを超えています: {search_size:,} bytes')
          if admin_search_size > 3 * 1024 * 1024:
              raise SystemExit(f'管理画面用書誌データが3MBを超えています: {admin_search_size:,} bytes')
          if book_index_size > 4 * 1024 * 1024:
              raise SystemExit(f'書籍検索索引が4MBを超えています: {book_index_size:,} bytes')
          if admin_index_size > 4 * 1024 * 1024:
              raise SystemExit(f'管理画面用書籍検索索引が4MBを超えています: {admin_index_size:,} bytes')
          if Path('docs/data/books.js').exists() or Path('docs/data/books.json').exists() or Path('docs/data/admin-books.js').exists():
              raise SystemExit('旧形式の巨大書誌データが残っています。')

          print(
              f'検証OK: 全{len(admin_books):,}件／公開{len(books):,}件／公開停止{len(hidden_ids):,}件／'
              f'詳細{len(detail_files):,}ファイル／公開表示{search_size / 1024 / 1024:.2f}MB／'
              f'管理表示{admin_search_size / 1024 / 1024:.2f}MB／公開索引{book_index_size / 1024 / 1024:.2f}MB／'
              f'管理索引{admin_index_size / 1024 / 1024:.2f}MB'
          )
          PY
          node --check docs/books/js/app.js
          node --check docs/js/home.js
          node --check docs/admin/books/admin.js
          git diff --check

      - name: Commit updated data
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/book_search_master.csv data/book_hidden_ids.txt
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Book data: issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '✅ 更新が完了しました。\n\n公開サイトへの反映も完了しました。\n\n公開サイトを確認：%s' "$PAGE_URL")"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  notify-failure:
    needs:
      - update
      - deploy
    if: ${{ always() && (needs.update.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify failed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'❌ 更新処理が完了しませんでした。\n\n公開サイトへの反映完了を確認できていません。\n\nこのIssueのURLを管理担当者へ送ってください。Actions画面を確認する必要はありません。'


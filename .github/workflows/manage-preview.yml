name: "【自動】立ち読みPDF申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: nippyo-site-maintenance
  queue: max
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ startsWith(github.event.issue.title, '[立ち読み管理]') && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームは更新権限のある担当者専用です。この申請からサイト内容は変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ startsWith(github.event.issue.title, '[立ち読み管理]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply preview request
        run: python scripts/manage_preview_issue.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/data/preview-index.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(payload, dict):
              raise SystemExit('preview-index.json の形式が不正です。')
          for key, prefix in (
              ('books', 'assets/preview/books/sample_'),
              ('magazines', 'assets/preview/magazines/sample_'),
          ):
              entries = payload.get(key)
              if not isinstance(entries, dict):
                  raise SystemExit(f'preview-index.json の {key} が不正です。')
              for item_id, value in entries.items():
                  if not isinstance(item_id, str) or not item_id:
                      raise SystemExit(f'{key} に空のIDがあります。')
                  if not isinstance(value, str) or not value.startswith(prefix) or '.pdf?v=' not in value:
                      raise SystemExit(f'{key} の立ち読みPDFパスが不正です: {item_id} / {value}')
          print(f"立ち読みPDFインデックス確認OK: 書籍{len(payload['books'])}件 / 雑誌{len(payload['magazines'])}件")
          PY
          node --check docs/admin/files/preview/admin.js
          node --check docs/books/js/preview.js
          git diff --check

      - name: Commit updated preview PDF
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/assets/preview docs/data/preview-index.json
          if git diff --cached --quiet; then
            echo "変更はありません。"
            exit 1
          fi
          git commit -m "Preview PDF: issue #${ISSUE_NUMBER} [skip ci]"
          git push origin main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout deployed source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify published update
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/verify_preview_update.py

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '✅ 更新が完了しました。\n\n立ち読みPDFの公開反映も自動確認できました。\n\n公開サイトを確認：%s' "$PAGE_URL")"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  notify-failure:
    needs:
      - update
      - deploy
    if: ${{ always() && (needs.update.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify failed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'❌ 立ち読みPDFの更新処理が完了しませんでした。\n\n公開サイトへの反映完了を確認できていません。\n\nこのIssueのURLを管理担当者へ送ってください。Actions画面を確認する必要はありません。'

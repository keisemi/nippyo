name: "【自動】関連リンク申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: nippyo-site-maintenance
  queue: max
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ startsWith(github.event.issue.title, '[関連リンク管理]') && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームは更新権限のある担当者専用です。この申請からサイト内容は変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ startsWith(github.event.issue.title, '[関連リンク管理]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply external link request
        run: python scripts/manage_book_external_link_issue.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          from urllib.parse import urlparse

          path = Path("docs/data/book-external-links.csv")
          with path.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          required = {"id", "slot", "title", "comment", "url"}
          if not rows:
              print("関連リンクCSV: 0件")
          for row in rows:
              if set(row) != required:
                  raise SystemExit("関連リンクCSVの列構成が不正です。")
              parsed = urlparse(row["url"])
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit(f"不正なURLがあります: {row['url']}")
          print(f"関連リンクCSV検証OK: {len(rows):,}件")
          PY
          node --check docs/admin/files/links/admin.js
          git diff --check

      - name: Commit updated external links
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/book-external-links.csv
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Book external link: issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '✅ 更新が完了しました。\n\n公開サイトへの反映も完了しました。\n\n公開サイトを確認：%s' "$PAGE_URL")"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

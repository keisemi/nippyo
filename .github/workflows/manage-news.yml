name: "【自動】お知らせ申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: nippyo-site-maintenance
  queue: max
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ startsWith(github.event.issue.title, '[お知らせ管理]') && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームはサイト更新権限のある担当者専用です。この申請からサイト内容は変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ startsWith(github.event.issue.title, '[お知らせ管理]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update news master from issue form
        run: python scripts/manage_news_issue.py

      - name: Generate public news data
        run: python scripts/build_news.py

      - name: Validate news data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          with Path('data/news.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          public = json.loads(Path('docs/data/news.json').read_text(encoding='utf-8'))

          ids = [str(x.get('id', '')).strip() for x in rows]
          if any(not x for x in ids):
              raise SystemExit('空のお知らせIDがあります。')
          if len(ids) != len(set(ids)):
              raise SystemExit('お知らせIDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in rows):
              raise SystemExit('空のタイトルがあります。')
          if not Path('docs/data/admin-news.js').exists():
              raise SystemExit('お知らせ管理用データが生成されていません。')
          print(f'検証OK: 全{len(rows):,}件／公開{len(public):,}件')
          PY
          node --check docs/js/news.js
          node --check docs/admin/news/admin.js
          git diff --check

      - name: Commit updated news
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.csv docs/data/news.json docs/data/news.js docs/data/admin-news.js docs/data/news-last-updated.txt
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "News: issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout deployed source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify published update
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERIFY_KIND: news
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/verify_public_update.py

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '✅ 更新が完了しました。\n\n公開サイトへの反映も自動確認できました。\n\n公開サイトを確認：%s' "$PAGE_URL")"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  notify-failure:
    needs:
      - update
      - deploy
    if: ${{ always() && (needs.update.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify failed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'❌ 更新処理が完了しませんでした。\n\n公開サイトへの反映完了を確認できていません。\n\nこのIssueのURLを管理担当者へ送ってください。Actions画面を確認する必要はありません。'


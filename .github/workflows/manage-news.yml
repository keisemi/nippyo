name: "【自動】お知らせ申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: news-data-maintenance
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ contains(github.event.issue.body, '### 修正・削除するお知らせ') && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームはサイト更新権限のある担当者専用です。この申請からサイト内容は変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ contains(github.event.issue.body, '### 修正・削除するお知らせ') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update news master from issue form
        run: python scripts/manage_news_issue.py

      - name: Generate public news data
        run: python scripts/build_news.py

      - name: Refresh registered-title dropdown
        run: python scripts/sync_news_workflow.py

      - name: Validate news data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          with Path('data/news.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          public = json.loads(Path('docs/data/news.json').read_text(encoding='utf-8'))

          ids = [str(x.get('id', '')).strip() for x in rows]
          if any(not x for x in ids):
              raise SystemExit('空のお知らせIDがあります。')
          if len(ids) != len(set(ids)):
              raise SystemExit('お知らせIDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in rows):
              raise SystemExit('空のタイトルがあります。')
          if not Path('docs/data/admin-news.js').exists():
              raise SystemExit('お知らせ管理用データが生成されていません。')
          print(f'検証OK: 全{len(rows):,}件／公開{len(public):,}件')
          PY
          node --check docs/js/news.js
          node --check docs/admin/news/admin.js
          git diff --check

      - name: Commit updated news
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.csv docs/data/news.json docs/data/news.js docs/data/admin-news.js docs/data/news-last-updated.txt .github/ISSUE_TEMPLATE/news_manage.yml
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "News: issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "お知らせの更新を反映し、臨時サイトを再公開しました。${PAGE_URL}"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

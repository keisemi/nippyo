name: "【自動】臨時サイトを再構築・公開（通常は操作不要）"

on:
  push:
    branches:
      - main
    paths:
      - "data/book_search_master.csv"
      - "data/news.csv"
      - "data/magazines/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate public book data
        run: python scripts/build_data.py

      - name: Generate public magazine issue data
        run: python scripts/build_magazine_data.py

      - name: Generate public news data
        run: python scripts/build_news.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def expand_rows(payload, key):
              if not isinstance(payload, dict):
                  return None
              rows = payload.get(key)
              if not isinstance(rows, list):
                  return None
              if not rows or not isinstance(rows[0], list):
                  return rows
              columns = payload.get('columns')
              if not isinstance(columns, list) or not columns:
                  raise SystemExit(f'{key} の列定義がありません。')
              if any(not isinstance(row, list) or len(row) != len(columns) for row in rows):
                  raise SystemExit(f'{key} の行長が列定義と一致しません。')
              return [dict(zip(columns, row)) for row in rows]

          search_payload = json.loads(Path('docs/data/books-search.json').read_text(encoding='utf-8'))
          books = expand_rows(search_payload, 'books')
          news = json.loads(Path('docs/data/news.json').read_text(encoding='utf-8'))
          if not isinstance(books, list) or not books:
              raise SystemExit('books-search.json が空です。')
          ids = [str(x.get('id', '')).strip() for x in books]
          if any(not x for x in ids):
              raise SystemExit('空の書籍IDがあります。')
          if len(ids) != len(set(ids)):
              raise SystemExit('書籍IDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in books):
              raise SystemExit('空の書名があります。')

          detail_ids = []
          detail_dir = Path('docs/data/book-details')
          detail_files = sorted(detail_dir.glob('books-detail-*.json'))
          if not detail_files:
              raise SystemExit('刊行年別の書籍詳細データが生成されていません。')
          for path in detail_files:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path} の形式が不正です。')
              detail_ids.extend(str(x).strip() for x in payload.keys())
          if len(detail_ids) != len(set(detail_ids)):
              raise SystemExit('刊行年別詳細データ内で書籍IDが重複しています。')
          if set(detail_ids) != set(ids):
              raise SystemExit('検索用データと刊行年別詳細データの書籍IDが一致しません。')

          search_size = Path('docs/data/books-search.json').stat().st_size
          if search_size > 5 * 1024 * 1024:
              raise SystemExit(f'検索用書誌データが5MBを超えています: {search_size:,} bytes')
          if Path('docs/data/books.js').exists() or Path('docs/data/books.json').exists() or Path('docs/data/admin-books.js').exists():
              raise SystemExit('旧形式の巨大書誌データが残っています。')

          magazine_search_path = Path('docs/data/magazine-issues-search.json')
          magazine_payload = json.loads(magazine_search_path.read_text(encoding='utf-8'))
          issues = expand_rows(magazine_payload, 'issues')
          if not isinstance(issues, list) or not issues:
              raise SystemExit('magazine-issues-search.json が空です。')
          magazine_ids = [str(x.get('id', '')).strip() for x in issues]
          if any(not x for x in magazine_ids):
              raise SystemExit('空の雑誌号IDがあります。')
          if len(magazine_ids) != len(set(magazine_ids)):
              raise SystemExit('雑誌号IDが重複しています。')
          if {str(x.get('magazine_id', '')).strip() for x in issues} != {'1', '2', '3', '4', '6', '7'}:
              raise SystemExit('定期雑誌6誌の雑誌ID構成が想定と一致しません。')
          if any('toc' in x or 'description' in x or 'description2' in x for x in issues):
              raise SystemExit('雑誌検索用データに目次または長文詳細が混入しています。')

          magazine_detail_ids = []
          magazine_detail_dir = Path('docs/data/magazine-details')
          magazine_detail_files = sorted(magazine_detail_dir.glob('magazine-details-*.json'))
          if not magazine_detail_files:
              raise SystemExit('刊行年別の雑誌号詳細データが生成されていません。')
          for path in magazine_detail_files:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path} の形式が不正です。')
              magazine_detail_ids.extend(str(x).strip() for x in payload.keys())
          if len(magazine_detail_ids) != len(set(magazine_detail_ids)):
              raise SystemExit('刊行年別雑誌詳細データ内で雑誌号IDが重複しています。')
          if set(magazine_detail_ids) != set(magazine_ids):
              raise SystemExit('雑誌検索用データと刊行年別詳細データのIDが一致しません。')

          magazine_search_size = magazine_search_path.stat().st_size
          if magazine_search_size > 2 * 1024 * 1024:
              raise SystemExit(f'雑誌検索用データが2MBを超えています: {magazine_search_size:,} bytes')

          if not Path('docs/data/admin-news.js').exists():
              raise SystemExit('お知らせ管理用データが生成されていません。')
          print(
              f'書籍検証OK: {len(books):,}件／詳細{len(detail_files):,}ファイル／'
              f'検索用{search_size / 1024 / 1024:.2f}MB／'
              f'雑誌号: {len(issues):,}件／詳細{len(magazine_detail_files):,}ファイル／'
              f'検索用{magazine_search_size / 1024 / 1024:.2f}MB／公開お知らせ: {len(news):,}件'
          )
          PY
          node --check docs/books/js/app.js
          node --check docs/js/home.js
          node --check docs/js/news.js
          node --check docs/admin/books/admin.js
          node --check docs/admin/news/admin.js
          git diff --check

      - name: Keep generated data in sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "生成済みデータは最新です。"
          else
            git commit -m "Sync generated search data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: "【自動】臨時サイトを再構築・公開（通常は操作不要）"

on:
  push:
    branches:
      - main
    paths:
      - "data/book_search_master.csv"
      - "data/news.csv"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate public book data
        run: python scripts/build_data.py

      - name: Generate public news data
        run: python scripts/build_news.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          search_payload = json.loads(Path('docs/data/books-search.json').read_text(encoding='utf-8'))
          books = search_payload.get('books') if isinstance(search_payload, dict) else None
          news = json.loads(Path('docs/data/news.json').read_text(encoding='utf-8'))
          if not isinstance(books, list) or not books:
              raise SystemExit('books-search.json が空です。')
          ids = [str(x.get('id', '')).strip() for x in books]
          if any(not x for x in ids):
              raise SystemExit('空の書籍IDがあります。')
          if len(ids) != len(set(ids)):
              raise SystemExit('書籍IDが重複しています。')
          if any(not str(x.get('title', '')).strip() for x in books):
              raise SystemExit('空の書名があります。')

          detail_ids = []
          detail_dir = Path('docs/data/book-details')
          detail_files = sorted(detail_dir.glob('books-detail-*.json'))
          if not detail_files:
              raise SystemExit('刊行年別の書籍詳細データが生成されていません。')
          for path in detail_files:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path} の形式が不正です。')
              detail_ids.extend(str(x).strip() for x in payload.keys())
          if len(detail_ids) != len(set(detail_ids)):
              raise SystemExit('刊行年別詳細データ内で書籍IDが重複しています。')
          if set(detail_ids) != set(ids):
              raise SystemExit('検索用データと刊行年別詳細データの書籍IDが一致しません。')

          search_size = Path('docs/data/books-search.json').stat().st_size
          if search_size > 8 * 1024 * 1024:
              raise SystemExit(f'検索用書誌データが8MBを超えています: {search_size:,} bytes')
          if Path('docs/data/books.js').exists() or Path('docs/data/books.json').exists() or Path('docs/data/admin-books.js').exists():
              raise SystemExit('旧形式の巨大書誌データが残っています。')
          if not Path('docs/data/admin-news.js').exists():
              raise SystemExit('お知らせ管理用データが生成されていません。')
          print(f'書籍検証OK: {len(books):,}件／詳細{len(detail_files):,}ファイル／検索用{search_size / 1024 / 1024:.2f}MB／公開お知らせ: {len(news):,}件')
          PY
          node --check docs/books/js/app.js
          node --check docs/js/home.js
          node --check docs/js/news.js
          node --check docs/admin/books/admin.js
          node --check docs/admin/news/admin.js
          git diff --check

      - name: Keep generated data in sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "生成済みデータは最新です。"
          else
            git commit -m "Sync generated search data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

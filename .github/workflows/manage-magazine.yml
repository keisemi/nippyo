name: "【自動】雑誌号申請を反映"

on:
  issues:
    types:
      - opened

concurrency:
  group: nippyo-site-maintenance
  queue: max
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: ${{ (startsWith(github.event.issue.title, '[雑誌号修正]') || startsWith(github.event.issue.title, '[雑誌号新規]')) && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reject unauthorized request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "このフォームは雑誌更新権限のある担当者専用です。この申請から雑誌データは変更されません。"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  update:
    if: ${{ (startsWith(github.event.issue.title, '[雑誌号修正]') || startsWith(github.event.issue.title, '[雑誌号新規]')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply magazine issue request
        run: python scripts/manage_magazine_issue.py

      - name: Generate magazine data
        run: python scripts/build_magazine_data.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          search = json.loads(Path("docs/data/magazine-issues-search.json").read_text(encoding="utf-8"))
          index = json.loads(Path("docs/data/magazine-issues-search-index.json").read_text(encoding="utf-8"))
          columns = search.get("columns")
          issues = search.get("issues")
          search_rows = index.get("search")
          if not isinstance(columns, list) or not columns:
              raise SystemExit("雑誌検索データの列定義がありません。")
          if not isinstance(issues, list) or not issues:
              raise SystemExit("雑誌検索データが空です。")
          if not isinstance(search_rows, list) or len(search_rows) != len(issues):
              raise SystemExit("雑誌検索データと検索索引の件数が一致しません。")
          if any(not isinstance(row, list) or len(row) != len(columns) for row in issues):
              raise SystemExit("雑誌検索データの行長が列定義と一致しません。")
          ids = [str(row[columns.index("id")]) for row in issues]
          if len(ids) != len(set(ids)):
              raise SystemExit("雑誌号の書籍IDが重複しています。")
          if not list(Path("docs/data/magazine-details").glob("magazine-details-*.json")):
              raise SystemExit("雑誌詳細データがありません。")
          print(f"雑誌データ検証OK: {len(issues):,}号")
          PY
          node --check docs/admin/magazines/admin.js
          git diff --check

      - name: Commit updated magazine data
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/magazines
          git add docs/data/magazine-issues-search.json
          git add docs/data/magazine-issues-search-index.json
          git add docs/data/magazine-details
          git add docs/data/magazine-last-updated.txt
          if git diff --cached --quiet; then
            echo "変更がありません。"
            exit 1
          fi
          if [[ "$ISSUE_TITLE" == \[雑誌号新規\]* ]]; then
            MESSAGE="Magazine issue add: issue #${ISSUE_NUMBER} [skip ci]"
          else
            MESSAGE="Magazine issue edit: issue #${ISSUE_NUMBER} [skip ci]"
          fi
          git commit -m "$MESSAGE"
          git push origin main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "雑誌号の登録・修正を反映し、臨時サイトを再公開しました。${PAGE_URL}"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
